[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpr-cpe-service-assurance-demo"
version = "1.13.0"
description = "Audit-hardened Docker Desktop demonstration of LPR CPE service assurance with LangGraph, Streamlit, FastAPI, MCP and deterministic controls."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "Proprietary demonstration bundle"}
authors = [{name = "LPR CPE Service Assurance"}]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "streamlit==1.61.1",
  "langchain==1.3.14",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "langchain-openai==1.5.1",
  "langchain-anthropic==1.5.6",
  "mcp==2.0.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "SQLAlchemy==2.0.50",
  "psycopg[binary,pool]==3.3.4",
  "httpx==0.28.1",
  "pandas==2.3.3",
  "plotly==6.3.1",
  "python-dotenv==1.1.1",
  "tenacity==9.1.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
# Optional richer OSM rendering. pydeck already ships with Streamlit,
# so the default map needs nothing from here.
map = ["folium>=0.17,<1", "streamlit-folium>=0.22,<1"]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.13.3",
  "mypy==1.18.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]
markers = [
  "framework: requires installed LangGraph, MCP or Streamlit packages",
  "postgres: requires a PostgreSQL service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lpr_cpe_demo"]
exclude = ["src/lpr_cpe_demo/ui/"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/lpr_cpe_demo"]
omit = [
  "src/lpr_cpe_demo/ui/*",
  "src/lpr_cpe_demo/workflow/langgraph_runtime.py",
  "src/lpr_cpe_demo/mcp_server/app.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
